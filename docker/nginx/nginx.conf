events {}

http {
  upstream cursive_app {
    server app1:4000;
    server app2:4000;
  }

  server {
    listen 80;

    location /sync {
      proxy_pass http://cursive_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /chat {
      proxy_pass http://cursive_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # Unlike /sync (Hocuspocus pings on its own timer), neither
      # chat/wsGateway.ts nor boardChat/wsGateway.ts sends any keepalive, so
      # nginx's default 60s proxy_read_timeout would silently disconnect and
      # reconnect (see useChatSocket.ts) every idle chat socket every minute.
      proxy_read_timeout 3600s;
    }

    location /board-chat {
      proxy_pass http://cursive_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # See the matching comment on /chat, above.
      proxy_read_timeout 3600s;
    }

    location /api {
      proxy_pass http://cursive_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      proxy_pass http://cursive_app;
    }
  }
}
