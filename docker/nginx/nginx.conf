events {}

http {
  upstream cursive_app {
    server app1:4000;
    server app2:4000;
  }

  server {
    listen 80;

    location /sync {
      proxy_pass http://cursive_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /chat {
      proxy_pass http://cursive_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # Unlike /sync (Hocuspocus pings on its own timer), neither
      # chat/wsGateway.ts nor boardChat/wsGateway.ts sends any keepalive, so
      # nginx's default 60s proxy_read_timeout would silently disconnect and
      # reconnect (see useChatSocket.ts) every idle chat socket every minute.
      proxy_read_timeout 3600s;
    }

    location /board-chat {
      proxy_pass http://cursive_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      # See the matching comment on /chat, above.
      proxy_read_timeout 3600s;
    }

    location /api {
      proxy_pass http://cursive_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
      proxy_pass http://cursive_app;
    }

    # Everything else (the React app's static files and client-side routes)
    # goes to the client container. Serving it from this same nginx, on the
    # same origin as /api, /sync, /chat, means the browser never sees the
    # client and the API as two different origins — no CORS, and cookies
    # set by the API are usable by the page that fetched them. That matters
    # once this is reached through a single public tunnel URL instead of
    # separate localhost ports.
    location / {
      proxy_pass http://client:80;
      proxy_set_header Host $host;
    }
  }
}
