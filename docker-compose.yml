name: real-time-collaborative-whiteboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cursive
      # Override via a root .env file (gitignored) for anything other than
      # plain local dev — see .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cursive_dev_password}
      POSTGRES_DB: cursive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursive"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    environment:
      # Docker Desktop on Windows is slow (sometimes effectively stuck)
      # binding the full 50000-60000 UDP range. Local dev only ever has a
      # couple of participants at once, so a much narrower range is plenty
      # and binds in a couple of seconds instead of minutes. Must match the
      # port mapping below — LiveKit only offers ICE candidates within
      # whatever range it's told here.
      - LIVEKIT_RTC_PORT_RANGE_START=50000
      - LIVEKIT_RTC_PORT_RANGE_END=50100
      # Without this, LiveKit advertises its own container-internal Docker
      # network IP (e.g. 172.18.0.3) as the address to send media to — a
      # browser on the host can never reach that, so calls connect
      # signaling but then silently fail to establish the actual audio/
      # video path. Browser and server share this machine via Docker
      # Desktop's published ports, so 127.0.0.1 is the address that's
      # actually reachable.
      - LIVEKIT_RTC_USE_EXTERNAL_IP=false
      - LIVEKIT_RTC_NODE_IP=127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  # Runs `prisma migrate deploy` before `npm run start` (see server/Dockerfile's
  # CMD). app2 waits on app1 being healthy (below) specifically so the two
  # instances don't run `prisma migrate deploy` concurrently at startup —
  # app1's /health endpoint only responds once its migration has finished and
  # the server has come up, so by the time app2 is allowed to start, app1's
  # migration has already applied cleanly.
  app1:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4001:4000"
    environment:
      INSTANCE_NAME: app1
      PORT: 4000
      DATABASE_URL: postgresql://cursive:${POSTGRES_PASSWORD:-cursive_dev_password}@postgres:5432/cursive?schema=public
      REDIS_URL: redis://redis:6379
      # CLIENT_URL and BETTER_AUTH_URL are the same value on purpose: nginx
      # serves the client and the API from one origin (see docker/nginx/
      # nginx.conf's catch-all `location /`), so there's only one public URL
      # for the whole app. Defaults to plain local docker-compose use;
      # override PUBLIC_URL in a root .env file to point at a tunnel (e.g.
      # `cloudflared tunnel --url http://localhost:8080`) — see .env.example.
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:8080}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      # NOTE: these secrets are scoped to the Docker stack and deliberately
      # differ from a local `server/.env`. Cookies are scoped by host, not
      # port, so a session minted by `npm run dev` (localhost:4000) and one
      # minted by this stack (localhost:8080) share a cookie name on
      # `localhost` but are signed with different keys — switching between
      # the two looks like a silent auth failure until cookies are cleared.
      # See the matching note in server/.env.example. Override these via a
      # root .env file (never commit real values) before exposing this
      # stack to anyone outside your own machine — see .env.example.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-not-a-real-secret-app-0001}
      SYNC_TICKET_SECRET: ${SYNC_TICKET_SECRET:-dev-only-not-a-real-secret-app-0002}
      # Defaults to the self-hosted `livekit` service below (same-machine
      # only, per its LIVEKIT_RTC_NODE_IP note). Set LIVEKIT_CLOUD_* in a
      # root .env to point calls at a LiveKit Cloud project instead — the
      # client never hardcodes a LiveKit URL, it uses whatever URL this
      # server hands back at call-token time (see boards.routes.ts's
      # `/call-token` route and client/src/call/useCall.ts's room.connect
      # call), so this is the only place that needs to change. See
      # .env.example.
      LIVEKIT_URL: ${LIVEKIT_CLOUD_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_CLOUD_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_CLOUD_API_SECRET:-secret}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s

  app2:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app1:
        condition: service_healthy
    ports:
      - "4002:4000"
    environment:
      INSTANCE_NAME: app2
      PORT: 4000
      DATABASE_URL: postgresql://cursive:${POSTGRES_PASSWORD:-cursive_dev_password}@postgres:5432/cursive?schema=public
      REDIS_URL: redis://redis:6379
      # See the matching NOTE on app1, above.
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:8080}
      BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-not-a-real-secret-app-0001}
      SYNC_TICKET_SECRET: ${SYNC_TICKET_SECRET:-dev-only-not-a-real-secret-app-0002}
      # See the matching note on app1, above.
      LIVEKIT_URL: ${LIVEKIT_CLOUD_URL:-ws://livekit:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_CLOUD_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_CLOUD_API_SECRET:-secret}

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app1
      - app2
      - client
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # Relative, not absolute: the browser resolves these against
        # whatever host actually served the page (localhost:8080, or a
        # tunnel's public URL), so this image never needs rebuilding just
        # because the public URL changed. Requires nginx.conf's catch-all
        # `location /` so the client and API share one origin. See
        # PUBLIC_URL in .env.example for the piece that DOES vary per-run.
        VITE_SYNC_URL: /sync
        VITE_CHAT_SOCKET_URL: /chat
        VITE_BOARD_CHAT_SOCKET_URL: /board-chat
        VITE_API_URL: ""
        VITE_LIVEKIT_URL: ws://localhost:7880
    restart: unless-stopped
    ports:
      - "8081:80"

volumes:
  postgres_data:
    # Pinned to the volume this project's containers have used since Phase 2
    # (before the project got an explicit `name:` above) so renaming the
    # compose project doesn't orphan the accumulated dev data.
    name: real-timecollaborativewhiteboard_postgres_data
