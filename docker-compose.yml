services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cursive
      POSTGRES_PASSWORD: cursive_dev_password
      POSTGRES_DB: cursive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cursive"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    environment:
      # Docker Desktop on Windows is slow (sometimes effectively stuck)
      # binding the full 50000-60000 UDP range. Local dev only ever has a
      # couple of participants at once, so a much narrower range is plenty
      # and binds in a couple of seconds instead of minutes. Must match the
      # port mapping below — LiveKit only offers ICE candidates within
      # whatever range it's told here.
      - LIVEKIT_RTC_PORT_RANGE_START=50000
      - LIVEKIT_RTC_PORT_RANGE_END=50100
      # Without this, LiveKit advertises its own container-internal Docker
      # network IP (e.g. 172.18.0.3) as the address to send media to — a
      # browser on the host can never reach that, so calls connect
      # signaling but then silently fail to establish the actual audio/
      # video path. Browser and server share this machine via Docker
      # Desktop's published ports, so 127.0.0.1 is the address that's
      # actually reachable.
      - LIVEKIT_RTC_USE_EXTERNAL_IP=false
      - LIVEKIT_RTC_NODE_IP=127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  app1:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4001:4000"
    environment:
      INSTANCE_NAME: app1
      PORT: 4000
      DATABASE_URL: postgresql://cursive:cursive_dev_password@postgres:5432/cursive?schema=public
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:8081
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: dev-only-not-a-real-secret-app-0001
      SYNC_TICKET_SECRET: dev-only-not-a-real-secret-app-0002
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret

  app2:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4002:4000"
    environment:
      INSTANCE_NAME: app2
      PORT: 4000
      DATABASE_URL: postgresql://cursive:cursive_dev_password@postgres:5432/cursive?schema=public
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:8081
      BETTER_AUTH_URL: http://localhost:8080
      BETTER_AUTH_SECRET: dev-only-not-a-real-secret-app-0001
      SYNC_TICKET_SECRET: dev-only-not-a-real-secret-app-0002
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app1
      - app2
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_SYNC_URL: ws://localhost:8080/sync
        VITE_CHAT_SOCKET_URL: ws://localhost:8080/chat
        VITE_BOARD_CHAT_SOCKET_URL: ws://localhost:8080/board-chat
        VITE_API_URL: http://localhost:8080
        VITE_LIVEKIT_URL: ws://localhost:7880
    restart: unless-stopped
    ports:
      - "8081:80"

volumes:
  postgres_data:
